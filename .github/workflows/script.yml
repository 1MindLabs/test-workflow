name: Clean Project Board

on:
  workflow_dispatch:

jobs:
  clean_project_board:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: read

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Get project data
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORGANIZATION: 1MindLabs
          PROJECT_NUMBER: 8
        run: |
          project_info=$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org){
                projectV2(number: $number) {
                  id
                  title
                }
              }
            }' -f org=$ORGANIZATION -F number=$PROJECT_NUMBER)
          
          echo 'PROJECT_ID='$(echo "$project_info" | jq -r '.data.organization.projectV2.id') >> $GITHUB_ENV

      - name: Clean Project Board
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          project_items=$(gh api graphql -f query='
            query($projectId: ID!) {
              node(id: $projectId) {
                ... on ProjectV2 {
                  items(first: 100) {
                    nodes {
                      id
                      content {
                        ... on Issue {
                          id
                          title
                          state
                          stateReason
                        }
                      }
                    }
                  }
                }
              }
            }' -f projectId=$PROJECT_ID)

          items_to_remove=$(echo "$project_items" | jq -r '.data.node.items.nodes[] | 
            select(.content.state == "CLOSED" and 
                   (.content.stateReason == "DUPLICATE" or .content.stateReason == "NOT_PLANNED")) | 
            .id')

          for item_id in $items_to_remove; do
            echo "Removing item: $item_id"
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!) {
                deleteProjectV2Item(input: {
                  projectId: $project
                  itemId: $item
                }) {
                  deletedItemId
                }
              }' -f project=$PROJECT_ID -f item=$item_id
          done

      - name: Log Cleanup
        if: always()
        run: |
          echo "Project board cleanup completed."
          echo "Total items removed: $(echo "$items_to_remove" | wc -l)"
