name: Label Issues for Project Automation
on:
  issues:
    types: [opened, reopened, closed, assigned]

jobs:
  label_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Add "Triage" label to new issues
        if: github.event.action == 'opened' || github.event.action == 'reopened'
        run: |
          gh issue edit ${{ github.event.issue.number }} --add-label "Triage"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add "In Progress" label when assigned
        if: github.event.action == 'assigned'
        run: |
          gh issue edit ${{ github.event.issue.number }} --add-label "In Progress"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add "Done" label when closed
        if: github.event.action == 'closed'
        run: |
          gh issue edit ${{ github.event.issue.number }} --add-label "Done"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
