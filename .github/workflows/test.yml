name: Automate Issues to Project

on:
  issues:
    types:
      - opened
      - assigned

jobs:
  manage_issues:
    name: Manage Issues in Project
    runs-on: ubuntu-latest
    steps:
      # 🔹 Generate GitHub App Token
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      # 🔹 Add issue to project when opened
      - name: Add Issue to Project
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORGANIZATION: 1MindLabs
          PROJECT_NUMBER: 8
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          project_id="$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org){
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org=$ORGANIZATION -F number=$PROJECT_NUMBER --jq '.data.organization.projectV2.id')"

          gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }' -f project=$project_id -f issue=$ISSUE_ID

      # 🔹 Label issue as "In Progress" when assigned
      - name: Label Issue "In Progress"
        if: github.event.action == 'assigned'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api -X POST repos/$REPO/issues/$ISSUE_NUMBER/labels \
            -f labels='["In Progress"]'
