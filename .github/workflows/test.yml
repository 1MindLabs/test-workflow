name: Automate Issues in Project

on:
  issues:
    types:
      - opened
      - assigned

jobs:
  manage_issues:
    name: Manage Issues in Project
    runs-on: ubuntu-latest
    steps:
      # 🔹 Generate GitHub App Token
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      # 🔹 Add issue to project when opened
      - name: Add Issue to Project
        if: github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORGANIZATION: 1MindLabs
          PROJECT_NUMBER: 8
          ISSUE_ID: ${{ github.event.issue.node_id }}
        run: |
          project_id="$(gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org){
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org=$ORGANIZATION -F number=$PROJECT_NUMBER --jq '.data.organization.projectV2.id')"

          item_id="$(gh api graphql -f query='
            mutation($project: ID!, $issue: ID!) {
              addProjectV2ItemById(input: {projectId: $project, contentId: $issue}) {
                item {
                  id
                }
              }
            }' -f project=$project_id -f issue=$ISSUE_ID --jq '.data.addProjectV2ItemById.item.id')"

          echo "ITEM_ID=$item_id" >> $GITHUB_ENV
          echo "PROJECT_ID=$project_id" >> $GITHUB_ENV

      # 🔹 Move issue to "In Progress" when assigned
      - name: Move Issue to "In Progress" in Project Board
        if: github.event.action == 'assigned'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ISSUE_ID: ${{ github.event.issue.node_id }}
          PROJECT_ID: ${{ env.PROJECT_ID }}
          STATUS_FIELD_ID: "PVTSSF_lADOCrqp684Azk1RzgpWIT0"  # Your Status Field ID
          IN_PROGRESS_OPTION_ID: "47fc9ee4"  # "In Progress" ID from your API output
        run: |
          # Get the Item ID of the issue in the project
          item_id="$(gh api graphql -f query='
            query($issue: ID!) {
              node(id: $issue) {
                ... on Issue {
                  projectItems(first: 1) {
                    nodes {
                      id
                    }
                  }
                }
              }
            }' -F issue=$ISSUE_ID --jq '.data.node.projectItems.nodes[0].id')"

          # Update the issue status to "In Progress"
          gh api graphql -f query='
            mutation($project: ID!, $item: ID!, $status_field: ID!, $status_value: ID!) {
              updateProjectV2ItemFieldValue(input: {
                projectId: $project
                itemId: $item
                fieldId: $status_field
                value: {
                  singleSelectOptionId: $status_value
                }
              }) {
                projectV2Item {
                  id
                }
              }
            }' -F project=$PROJECT_ID -F item=$item_id -F status_field=$STATUS_FIELD_ID -F status_value=$IN_PROGRESS_OPTION_ID
