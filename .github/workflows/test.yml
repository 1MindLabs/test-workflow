name: Clean Project Board
on:
  # Run weekly, or adjust as needed
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight
  # Optional: Allow manual triggering
  workflow_dispatch:

jobs:
  clean_project_board:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: read

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PEM }}

      - name: Get project data
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          ORGANIZATION: 1MindLabs
          PROJECT_NUMBER: 8
        run: |
          gh api graphql -f query='
            query($org: String!, $number: Int!) {
              organization(login: $org){
                projectV2(number: $number) {
                  id
                }
              }
            }' -f org=$ORGANIZATION -F number=$PROJECT_NUMBER > project_data.json
          echo 'PROJECT_ID='$(jq '.data.organization.projectV2.id' project_data.json) >> $GITHUB_ENV

      - name: Clean Project Board
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          # Fetch all items in the project
          gh api graphql -f query='
            query($project:ID!) {
              projectV2(id: $project) {
                items(first: 100) {
                  nodes {
                    id
                    content {
                      ... on Issue {
                        id
                        title
                        state
                        stateReason
                      }
                    }
                  }
                }
              }
            }' -f project=$PROJECT_ID > project_items.json

          # Process and remove closed issues marked as duplicate or not planned
          items_to_remove=$(jq -r '.data.projectV2.items.nodes[] | 
            select(.content.state == "CLOSED" and 
                   (.content.stateReason == "DUPLICATE" or .content.stateReason == "NOT_PLANNED")) | 
            .id' project_items.json)

          # Remove items from the project board
          for item_id in $items_to_remove; do
            echo "Removing item: $item_id"
            gh api graphql -f query='
              mutation($project: ID!, $item: ID!) {
                deleteProjectV2Item(input: {
                  projectId: $project
                  itemId: $item
                }) {
                  deletedItemId
                }
              }' -f project=$PROJECT_ID -f item=$item_id
          done

      - name: Log Cleanup
        if: always()
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          echo "Project board cleanup completed."
          echo "Total items removed: $(echo "$items_to_remove" | wc -l)"